name: Build Ghidra ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Ghidra JDK Version
        shell: bash
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Fetch Dependencies
        run: ./gradlew -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build Native ARM64
        run: ./gradlew buildNatives_linux_arm_64 --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-arm64-natives
          path: Ghidra/Features/Decompiler/os/linux_arm_64/
