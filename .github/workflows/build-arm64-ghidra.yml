name: Build Ghidra ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Native ARM64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)
          echo "JDK: $JDK_VER"
          sudo apt-get install -y -qq openjdk-$JDK_VER-jdk-headless
          ./gradlew buildNatives_linux_arm_64 --no-daemon -x test -x precommit
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-arm64-natives
          path: Ghidra/Features/Decompiler/os/linux_arm_64/
