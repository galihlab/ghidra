name: Build Ghidra ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Read Ghidra JDK Version
        shell: bash
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Fetch Dependencies
        run: ./gradlew -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build Native ARM64
        run: ./gradlew buildNatives_linux_arm_64 --no-daemon

      - name: Locate and Collect Natives
        run: |
          echo "=== Searching for built native files ==="
          find . -type f \( -name "decompile" -o -name "sleigh" -o -name "*.so" \) -path "*linux_arm_64*" 2>/dev/null
          echo "=== build dirs ==="
          find . -type d -name "linux_arm_64" 2>/dev/null | head -20
          # Collect everything into a known dir
          mkdir -p /tmp/natives
          find . -type f \( -name "decompile" -o -name "sleigh" -o -name "*.so" \) -path "*linux_arm_64*" -exec cp --parents {} /tmp/natives/ \; 2>/dev/null || true
          ls -laR /tmp/natives | head -50

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-arm64-natives
          path: /tmp/natives/
