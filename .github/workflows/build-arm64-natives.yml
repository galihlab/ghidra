name: Build Ghidra Full (ARM64 Artifact)

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone Official Ghidra
        run: |
          git clone --depth=1 --branch Ghidra_12.1.4_build https://github.com/NationalSecurityAgency/ghidra.git /tmp/ghidra-src
          echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' /tmp/ghidra-src/Ghidra/application.properties)" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Build Ghidra
        working-directory: /tmp/ghidra-src
        run: ./gradlew buildGhidra --no-daemon --parallel 2>&1

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghidra-linux-full
          path: /tmp/ghidra-src/build/dist/ghidra_*.zip
