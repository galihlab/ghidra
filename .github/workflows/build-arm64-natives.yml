name: Build ARM64 Native Decompiler

on:
  workflow_dispatch:
  push:
    branches: [ "arm64-build" ]

jobs:
  build-natives:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo -S -p '' apt-get install -y g++ make gradle

      - name: Build ARM64 natives
        run: |
          gradle buildNatives_linux_arm_64 --no-daemon -x test -x precommit
          echo "BUILD_DONE=true" >> $GITHUB_ENV

      - name: Package artifact
        run: |
          # Native libs end up in Ghidra/Features/Decompiler/os/linux_arm_64/
          find . -path "*/os/linux_arm_64/*.so" -type f
          mkdir -p /tmp/ghidra-arm64-natives
          find . -path "*/os/linux_arm_64" -type d -exec cp -r {} /tmp/ghidra-arm64-natives/ \;
          cd /tmp/ghidra-arm64-natives && tar czf /tmp/ghidra-arm64-natives.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-arm64-natives
          path: /tmp/ghidra-arm64-natives.tar.gz
